<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Last Gift - For Cristy</title>

    <!-- Google Fonts: Inter + Great Vibes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Soft Pink Aesthetic matching reference photo */
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #5d4037;
        }

        /* Ambient Canvas */
        canvas#ambientCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            max-width: 520px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Styles */
        .intro-group {
            transition: opacity 0.8s ease, transform 0.8s ease;
            margin-bottom: 30px;
        }

        .intro-title {
            font-family: 'Great Vibes', cursive;
            font-size: 52px;
            color: #8e244d;
            font-weight: 400;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.6);
        }

        .intro-subtitle {
            font-size: 13px;
            font-weight: 400;
            color: #8c5b6b;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ✉️ INTERACTIVE ENVELOPE STYLES */
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            margin: 20px 0;
            perspective: 1000px;
        }

        .envelope {
            position: relative;
            width: 280px;
            height: 180px;
            /* Soft dusty blush pink envelope body */
            background: #f3c2c7;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 15px 35px rgba(186, 104, 129, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .envelope-wrapper:hover .envelope {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(186, 104, 129, 0.4);
        }

        /* Envelope Top Flap */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            /* Inner/Flap color matches photo's soft rose tint */
            border-top: 100px solid #eab0b7;
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
        }

        /* Envelope Side & Bottom Folds */
        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 140px solid #e2a8b0;
            border-right: 140px solid #e2a8b0;
            border-bottom: 95px solid #ebb4bc;
            border-radius: 0 0 8px 8px;
            z-index: 3;
        }

        /* Rose Gold / Dusty Pink Wax Seal */
        .wax-seal {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #d48b97 0%, #b86271 100%);
            border: 2px solid #fce4ec;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 16px;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(136, 14, 79, 0.25);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Letter Inside Envelope (Cream / Off-white card style) */
        .letter-preview {
            position: absolute;
            bottom: 10px;
            width: 240px;
            height: 140px;
            background: #fffcf8;
            border: 1px solid #f3d8d6;
            border-radius: 6px;
            z-index: 2;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.05);
        }

        .click-hint {
            font-size: 11px;
            color: #8e244d;
            margin-top: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            animation: pulse 2s infinite;
        }

        /* ✉️ OPENED ANIMATION STATE */
        .envelope-wrapper.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open .wax-seal {
            opacity: 0;
            transform: translateX(-50%) scale(0.5);
        }

        .envelope-wrapper.open .letter-preview {
            transform: translateY(-110px);
            z-index: 5;
        }

        /* 📄 FINAL ELEGANT CARD */
        .final-card {
            display: none;
            opacity: 0;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(186, 104, 129, 0.25);
            margin-top: 10px;
            transform: translateY(20px);
            transition: opacity 1.2s ease, transform 1.2s ease;
            text-align: center;
        }

        .final-card.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .final-card h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 44px;
            color: #8e244d;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .final-card p {
            font-size: 14px;
            line-height: 1.8;
            color: #6a4a53;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-bottom: 25px;
        }

        .final-card .love-signature {
            font-family: 'Great Vibes', cursive;
            font-size: 32px;
            color: #b86271;
        }

        /* ↺ RELIVE OUR JOURNEY BUTTON */
        .relive-btn {
            display: none;
            opacity: 0;
            margin-top: 30px;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.8);
            color: #8e244d;
            border: 1px solid #d48b97;
            border-radius: 25px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(186, 104, 129, 0.15);
        }

        .relive-btn.show {
            display: inline-block;
            opacity: 1;
            animation: fadeIn 1s ease;
        }

        .relive-btn:hover {
            background: #8e244d;
            color: #ffffff;
            border-color: #8e244d;
            box-shadow: 0 6px 20px rgba(142, 36, 77, 0.3);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Ambient Canvas -->
    <canvas id="ambientCanvas"></canvas>

    <div class="container">
        
        <!-- Minimalist Header -->
        <div class="intro-group" id="introGroup">
            <h1 class="intro-title">One Last Gift...</h1>
            <p class="intro-subtitle">Thank you for taking this journey with me</p>
        </div>

        <!-- ✉️ Interactive Envelope -->
        <div class="envelope-wrapper" id="envelopeWrapper" onclick="openEnvelope()">
            <div class="envelope">
                <div class="envelope-flap"></div>
                <div class="wax-seal">♥</div>
                <div class="letter-preview"></div>
                <div class="envelope-pocket"></div>
            </div>
            <p class="click-hint" id="clickHint">✦ Tap to open ✦</p>
        </div>

        <!-- 📄 Final Minimalist Message Card -->
        <div class="final-card" id="finalCard">
            <h2>Happy 3rd Anniversary, My Love.</h2>
            <p>
                Three years, countless memories, and a lifetime more to go. No matter where life takes us, my favorite place will always be by your side.
            </p>
            <div class="love-signature">I love you, always. ♥</div>
        </div>

        <!-- ↺ Relive Button -->
        <div>
            <a href="index.html" class="relive-btn" id="reliveBtn">↺ Relive Our Journey</a>
        </div>

    </div>

    <script>
        // Minimal Background Particles adjusted for light pink theme
        const canvas = document.getElementById('ambientCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let particles = [];
        let envelopeOpened = false;

        class Particle {
            constructor(type) {
                this.type = type; // 'sparkle', 'heart', 'confetti'
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height - height;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 0.8 + 0.3;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.opacity = Math.random() * 0.6 + 0.2;

                if (this.type === 'heart') {
                    this.size = Math.random() * 6 + 4;
                    this.color = '#c25975';
                } else if (this.type === 'confetti') {
                    this.size = Math.random() * 5 + 3;
                    const colors = ['#ffffff', '#f8bbd0', '#d48b97', '#8e244d'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.speedY = Math.random() * 2 + 1;
                } else {
                    this.color = '#ffffff';
                }
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                if (this.y > height + 20) {
                    this.reset();
                    this.y = -10;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;

                if (this.type === 'heart') {
                    ctx.translate(this.x, this.y);
                    ctx.beginPath();
                    ctx.arc(-this.size/4, -this.size/4, this.size/4, 0, Math.PI, true);
                    ctx.arc(this.size/4, -this.size/4, this.size/4, 0, Math.PI, true);
                    ctx.lineTo(0, this.size/2);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // Soft initial particles
        for (let i = 0; i < 40; i++) {
            particles.push(new Particle('sparkle'));
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();

        // ✉️ ENVELOPE OPENING LOGIC
        function openEnvelope() {
            if (envelopeOpened) return;
            envelopeOpened = true;

            const envelopeWrapper = document.getElementById('envelopeWrapper');
            const clickHint = document.getElementById('clickHint');
            const introGroup = document.getElementById('introGroup');
            const finalCard = document.getElementById('finalCard');
            const reliveBtn = document.getElementById('reliveBtn');

            // 1. Open Envelope Animation
            envelopeWrapper.classList.add('open');
            clickHint.style.opacity = '0';

            // 2. Add soft celebration particles
            for (let i = 0; i < 35; i++) {
                let pHeart = new Particle('heart');
                pHeart.y = height / 2;
                pHeart.x = width / 2 + (Math.random() * 100 - 50);
                pHeart.speedY = Math.random() * -3 - 1;
                particles.push(pHeart);
            }

            // 3. Fade out envelope & header gracefully
            setTimeout(() => {
                envelopeWrapper.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                envelopeWrapper.style.opacity = '0';
                envelopeWrapper.style.transform = 'translateY(-20px)';

                introGroup.style.opacity = '0';

                setTimeout(() => {
                    envelopeWrapper.style.display = 'none';
                    introGroup.style.display = 'none';

                    // 4. Reveal Final Card
                    finalCard.classList.add('show');

                    // 5. Reveal Relive Button
                    setTimeout(() => {
                        reliveBtn.classList.add('show');
                    }, 1800);

                }, 800);
            }, 1200);
        }
    </script>
</body>
</html>
