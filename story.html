<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story - Cristy Limbago</title>
    <!-- Google Fonts: Playfair Display & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            font-family: 'Playfair Display', serif;
            position: relative;
            overflow-x: hidden;
            
            /* Background Photo with Transparent Maroon Overlay */
            background: 
                linear-gradient(rgba(55, 10, 18, 0.75), rgba(55, 10, 18, 0.75)), 
                url('photo8.jpg.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Direct Container Without Card Background */
        .content-container {
            position: relative;
            z-index: 2;
            max-width: 650px;
            width: 100%;
            text-align: center;
        }

        /* Minimalist Heart Accent */
        .heart-icon {
            font-size: 34px;
            color: #ffffff;
            margin-bottom: 25px;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Typewriter Text - Clean White Style */
        .typewriter-text {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 500;
            color: #ffffff;
            line-height: 1.8;
            min-height: 120px;
            white-space: pre-wrap;
            text-align: left;
            letter-spacing: 0.4px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); /* Text shadow para super visible */
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 22px;
            background-color: #ffffff;
            animation: blink 0.7s infinite;
            vertical-align: middle;
            margin-left: 2px;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Aesthetic Minimalist White & Maroon Button */
        .btn {
            display: none;
            margin-top: 40px;
            padding: 14px 38px;
            background-color: #ffffff;
            color: #4a0e18;
            border: none;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            background-color: #f8dfe5;
            color: #370a12;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div class="content-container">
        <div class="heart-icon">♥</div>
        
        <div class="typewriter-text"><span id="typed"></span><span class="cursor">&nbsp;</span></div>

        <!-- Link Redirection Button -->
        <a id="openBtn" href="gallery.html" class="btn">Open Our Memories ✨</a>
    </div>

    <script>
        const textToType = `Hi, Cristy... Mi amor. ♡

If you're reading this, then you've already found the little surprise I've been keeping just for you.

Before anything else...
Happy 3rd Anniversary, my love. ♥️

Three years ago, we started a story that slowly became one of the most beautiful parts of my life.

Since then, every smile, every laugh, every adventure, every challenge, and every "I love you" has become a memory I'll always cherish.

People say time flies...
But with you, every moment is worth remembering.

This isn't just a collection of pictures.
It's a little piece of our journey.
A reminder of how "you and me" became us.

So, take your time.
Smile.
Cry.
Relive every moment. ♡`;
        
        let charIndex = 0;

        function runTypewriter() {
            const container = document.getElementById("typed");
            const btn = document.getElementById("openBtn");

            if (charIndex < textToType.length) {
                container.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(runTypewriter, 32);
            } else {
                if (btn) {
                    btn.style.display = "inline-block";
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            runTypewriter();
        });
    </script>

</body>
</html>
