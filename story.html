<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story - Cristy Limbago</title>
    <style>
        body {
            background-color: #f8dfe5;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
            margin-bottom: 30px;
        }

        .typewriter-text {
            font-size: 20px;
            color: #4a3b3e;
            line-height: 1.8;
            min-height: 100px;
            white-space: pre-wrap;
            text-align: left;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #e36f88;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .btn {
            display: none;
            margin-top: 25px;
            padding: 12px 28px;
            background-color: #e36f88;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #d15671;
        }

        #hiddenStory {
            display: none;
            margin-top: 30px;
            border-top: 2px dashed #f3d2d9;
            padding-top: 20px;
        }

        /* 📸 PHOTO GALLERY STYLES */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .polaroid-card {
            background: white;
            padding: 12px 12px 20px 12px;
            border-radius: 10px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .polaroid-card:hover {
            transform: translateY(-8px) rotate(1deg);
            box-shadow: 0 12px 20px rgba(0,0,0,0.15);
        }

        .polaroid-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
        }

        .polaroid-card p {
            margin: 12px 0 0 0;
            font-size: 14px;
            color: #555;
            font-weight: bold;
        }

        /* 🔍 LIGHTBOX POPUP STYLES */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 💌 TYPEWRITER CARD -->
    <div class="card">
        <div style="font-size: 40px; color: #e36f88;">♥</div>
        
        <div class="typewriter-text"><span id="typed"></span><span class="cursor">&nbsp;</span></div>

        <button id="openBtn" class="btn" onclick="showStory()">Open Our Memories ✨</button>

        <div id="hiddenStory">
            <h2 style="color: #e36f88; margin-bottom: 25px;">Happy 3rd Anniversary!</h2>
            
            <!-- 📸 PHOTO GALLERY (14 PHOTOS) -->
            <div class="photo-grid">
                <div class="polaroid-card" onclick="openLightbox('images/photo1.jpg', 'Our First Date ♥')">
                    <img src="images/photo1.jpg" alt="Memory 1">
                    <p>Our First Date ♥</p>
                </div>
                <div class="polaroid-card" onclick="openLightbox('images/photo2.jpg', 'Unforgettable Smile 😊')">
                    <img src="images/photo2.jpg" alt="Memory 2">
                    <p>Unforgettable Smile 😊</p>
                </div>
                <div class="polaroid-card" onclick="openLightbox('images/photo3.jpg', 'Sweet Moments ✨')">
                    <img src="images/photo3.jpg" alt="Memory 3">
                    <p>Sweet Moments ✨</p>
                </div>
                <div class="polaroid-card" onclick="openLightbox('images/photo4.jpg', 'Random Cute Date 🍦')">
                    <img src="images/photo4.jpg" alt="Memory 4">
                    <p>Random Cute Date 🍦</p>
                </div>
                <div class="polaroid-card" onclick="openLightbox('images/photo5.jpg', 'Favorite Place 🌿')">
                    <img src="images/photo5.jpg" alt="Memory 5">
                    <p>Favorite Place 🌿</p>
                </div>
                <div class="polaroid-card" onclick="openLightbox('images/photo6.jpg', 'To More Adventures 🥂')">
                    <img src="images/photo6.jpg" alt="Memory 6">
                    <p>To More Adventures 🥂</p>
                </div>
                <div class="polaroid-card" onclick="openLightbox('images/photo7.jpg', 'Coffee Date ☕')">
                    <img src="images/photo7.jpg" alt="Memory 7">
                    <p>Coffee Date ☕</p>
                </div>
                <div class="polaroid-card" onclick="openLightbox('images/photo8.jpg', 'Holding Hands ♥')">
                    <img src="images/photo8.jpg" alt="Memory 8">
                    <p>Holding Hands ♥</p>
                </div>
                <div class="polaroid-card" onclick="openLightbox('images/photo9.jpg', 'Special Moments 🌙')">
                    <img src="images/photo9.jpg" alt="Memory 9">
                    <p>Special Moments 🌙</p>
                </div>
                <div class="polaroid-card" onclick="openLightbox('images/photo10.jpg', 'Silly & Happy 🤪')">
                    <img src="images/photo10.jpg" alt="Memory 10">
                    <p>Silly & Happy 🤪</p>
                </div>
                <div class="polaroid-card" onclick="openLightbox('images/photo11.jpg', 'Sunset View 🌅')">
                    <img src="images/photo11.jpg" alt="Memory 11">
                    <p>Sunset View 🌅</p>
                </div>
                <div class="polaroid-card" onclick="openLightbox('images/photo12.jpg', 'Celebration 🎉')">
                    <img src="images/photo12.jpg" alt="Memory 12">
                    <p>Celebration 🎉</p>
                </div>
                <div class="polaroid-card" onclick="openLightbox('images/photo13.jpg', 'My Favorite Person 💖')">
                    <img src="images/photo13.jpg" alt="Memory 13">
                    <p>My Favorite Person 💖</p>
                </div>
                <div class="polaroid-card" onclick="openLightbox('images/photo14.jpg', 'Forever & Always ♾️')">
                    <img src="images/photo14.jpg" alt="Memory 14">
                    <p>Forever & Always ♾️</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 🔍 LIGHTBOX MODAL -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Full view">
        <div id="lightbox-caption" style="color: white; font-size: 18px; margin-top: 12px; font-family: sans-serif;"></div>
    </div>

    <script>
        const textToType = "Hi Cristy, my love...\n\nEvery single day with you is a gift, but today is extra special. Happy 3rd Anniversary! Thank you for 3 amazing years of love, laughter, and endless happiness. Here is a little glimpse of our forever... ♥";
        
        let charIndex = 0;

        function runTypewriter() {
            const container = document.getElementById("typed");
            const btn = document.getElementById("openBtn");

            if (charIndex < textToType.length) {
                container.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(runTypewriter, 50);
            } else {
                if (btn) btn.style.display = "inline-block";
            }
        }

        function showStory() {
            document.getElementById("openBtn").style.display = "none";
            document.getElementById("hiddenStory").style.display = "block";
        }

        function openLightbox(src, caption) {
            document.getElementById("lightbox-img").src = src;
            document.getElementById("lightbox-caption").textContent = caption;
            document.getElementById("lightbox").style.display = "flex";
        }

        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }

        window.onload = function() {
            runTypewriter();
        };
    </script>

</body>
</html>
