<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story - Cristy Limbago</title>
    <!-- Google Fonts: Playfair Display (Romantic Typewriter Style) & Montserrat (Clean Button) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Minimalist Soft Pink Gradient Background */
            background: linear-gradient(135deg, #fbe8ed 0%, #f3d5dd 50%, #eae0e6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Playfair Display', serif;
            position: relative;
            overflow-x: hidden;
        }

        /* Minimalist Background Pattern (Soft Floating Hearts & Sparkles) */
        .bg-decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .floating-symbol {
            position: absolute;
            color: rgba(227, 111, 136, 0.25);
            font-size: 20px;
            animation: floatUp 8s infinite ease-in-out;
        }

        .s1 { top: 80%; left: 10%; animation-delay: 0s; font-size: 24px; }
        .s2 { top: 70%; left: 85%; animation-delay: 2s; font-size: 18px; }
        .s3 { top: 90%; left: 75%; animation-delay: 4s; font-size: 28px; }
        .s4 { top: 75%; left: 20%; animation-delay: 1s; font-size: 16px; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(20deg); opacity: 0; }
        }

        /* Card Container (Minimalist Glass Effect) */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(214, 140, 158, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
            max-width: 620px;
            width: 100%;
            text-align: center;
        }

        /* Minimalist Heart Accent at the top */
        .heart-icon {
            font-size: 32px;
            color: #e36f88;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Typewriter Text - Classic Romantic Font */
        .typewriter-text {
            font-family: 'Playfair Display', serif;
            font-size: 21px;
            font-weight: 500;
            color: #3d2b30;
            line-height: 1.8;
            min-height: 120px;
            white-space: pre-wrap;
            text-align: left;
            letter-spacing: 0.3px;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 22px;
            background-color: #e36f88;
            animation: blink 0.7s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Aesthetic Minimalist Button */
        .btn {
            display: none;
            margin-top: 35px;
            padding: 14px 36px;
            background: linear-gradient(135deg, #e36f88 0%, #d15671 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s ease;
            box-shadow: 0 8px 20px rgba(227, 111, 136, 0.25);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(227, 111, 136, 0.35);
            background: linear-gradient(135deg, #d15671 0%, #bd435e 100%);
        }
    </style>
</head>
<body>

    <!-- Subtle Background Accents -->
    <div class="bg-decorations">
        <span class="floating-symbol s1">♥</span>
        <span class="floating-symbol s2">✨</span>
        <span class="floating-symbol s3">♡</span>
        <span class="floating-symbol s4">✨</span>
    </div>

    <!-- Main Card -->
    <div class="card">
        <div class="heart-icon">♥</div>
        
        <div class="typewriter-text"><span id="typed"></span><span class="cursor">&nbsp;</span></div>

        <!-- Link Redirection Button -->
        <a id="openBtn" href="gallery.html" class="btn">Open Our Memories ✨</a>
    </div>

    <script>
        const textToType = `Hi, Cristy... Mi amor. ♡

If you're reading this, then you've already found the little surprise I've been keeping just for you.

Before anything else...
Happy 3rd Anniversary, my love. ♥️

Three years ago, we started a story that slowly became one of the most beautiful parts of my life.

Since then, every smile, every laugh, every adventure, every challenge, and every "I love you" has become a memory I'll always cherish.

People say time flies...
But with you, every moment is worth remembering.

This isn't just a collection of pictures.
It's a little piece of our journey.
A reminder of how "you and me" became us.

So, take your time.
Smile.
Cry.
Relive every moment. ♡`;
        
        let charIndex = 0;

        function runTypewriter() {
            const container = document.getElementById("typed");
            const btn = document.getElementById("openBtn");

            if (charIndex < textToType.length) {
                container.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(runTypewriter, 32);
            } else {
                if (btn) {
                    btn.style.display = "inline-block";
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            runTypewriter();
        });
    </script>

</body>
</html>
