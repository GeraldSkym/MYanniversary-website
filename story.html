<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story - Cristy Limbago</title>
    <style>
        body {
            background-color: #f8dfe5;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .typewriter-text {
            font-size: 20px;
            color: #4a3b3e;
            line-height: 1.8;
            min-height: 100px;
            white-space: pre-wrap;
            text-align: left;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #e36f88;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .btn {
            display: none;
            margin-top: 25px;
            padding: 12px 28px;
            background-color: #e36f88;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #d15671;
        }
    </style>
</head>
<body>

    <div class="card">
        <div style="font-size: 40px; color: #e36f88;">♥</div>
        
        <div class="typewriter-text"><span id="typed"></span><span class="cursor">&nbsp;</span></div>

        <!-- Pupunta na ito sa gallery.html -->
        <a id="openBtn" href="gallery.html" class="btn">Open Our Memories ✨</a>
    </div>

    <script>
        const textToType = "Hi Cristy, my loveee!...\n\nEvery single day with you is a gift, but today is extra special. Happy 3rd Anniversary! Thank you for 3 amazing years of love, laughter, and endless happiness. Here is a little glimpse of our forever... ♥";
        
        let charIndex = 0;

        function runTypewriter() {
            const container = document.getElementById("typed");
            const btn = document.getElementById("openBtn");

            if (charIndex < textToType.length) {
                container.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(runTypewriter, 50);
            } else {
                if (btn) btn.style.display = "inline-block";
            }
        }

        window.onload = function() {
            runTypewriter();
        };
    </script>

</body>
</html>
