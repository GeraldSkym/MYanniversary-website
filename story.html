<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story - Cristy Limbago</title>
    <!-- Google Fonts: Playfair Display & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Playfair Display', serif;
            position: relative;
            overflow-x: hidden;
            
            /* Background Photo with Dark Transparent Maroon Overlay */
            background: 
                linear-gradient(rgba(74, 14, 26, 0.65), rgba(74, 14, 26, 0.65)), 
                url('photo8.jpg.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Card Container (Minimalist Glass Effect) */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.6);
            max-width: 620px;
            width: 100%;
            text-align: center;
        }

        /* Minimalist Heart Accent */
        .heart-icon {
            font-size: 32px;
            color: #800020; /* Deep Burgundy / Maroon */
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Typewriter Text */
        .typewriter-text {
            font-family: 'Playfair Display', serif;
            font-size: 21px;
            font-weight: 500;
            color: #2b1216; /* Dark readable tone */
            line-height: 1.8;
            min-height: 120px;
            white-space: pre-wrap;
            text-align: left;
            letter-spacing: 0.3px;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 22px;
            background-color: #800020;
            animation: blink 0.7s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Aesthetic Minimalist Maroon Button */
        .btn {
            display: none;
            margin-top: 35px;
            padding: 14px 36px;
            background: linear-gradient(135deg, #800020 0%, #580016 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s ease;
            box-shadow: 0 8px 20px rgba(128, 0, 32, 0.35);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(128, 0, 32, 0.45);
            background: linear-gradient(135deg, #6b001b 0%, #420010 100%);
        }
    </style>
</head>
<body>

    <!-- Main Card -->
    <div class="card">
        <div class="heart-icon">♥</div>
        
        <div class="typewriter-text"><span id="typed"></span><span class="cursor">&nbsp;</span></div>

        <!-- Link Redirection Button -->
        <a id="openBtn" href="gallery.html" class="btn">Open Our Memories ✨</a>
    </div>

    <script>
        const textToType = `Hi, Cristy... Mi amor. ♡

If you're reading this, then you've already found the little surprise I've been keeping just for you.

Before anything else...
Happy 3rd Anniversary, my love. ♥️

Three years ago, we started a story that slowly became one of the most beautiful parts of my life.

Since then, every smile, every laugh, every adventure, every challenge, and every "I love you" has become a memory I'll always cherish.

People say time flies...
But with you, every moment is worth remembering.

This isn't just a collection of pictures.
It's a little piece of our journey.
A reminder of how "you and me" became us.

So, take your time.
Smile.
Cry.
Relive every moment. ♡`;
        
        let charIndex = 0;

        function runTypewriter() {
            const container = document.getElementById("typed");
            const btn = document.getElementById("openBtn");

            if (charIndex < textToType.length) {
                container.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(runTypewriter, 32);
            } else {
                if (btn) {
                    btn.style.display = "inline-block";
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            runTypewriter();
        });
    </script>

</body>
</html>
