<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Me First - Cristy Limbago</title>
    <!-- Google Fonts: Great Vibes (Title) & Playfair Display / Montserrat (Text & Button) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            font-family: 'Playfair Display', serif;
            position: relative;
            overflow-x: hidden;
            
            /* Background Photo with Soft Vignette Maroon Blend */
            background: 
                radial-gradient(circle at center, rgba(65, 12, 22, 0.70) 0%, rgba(30, 5, 10, 0.90) 100%), 
                url('image/photo8.jpg.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Ambient Glow Effect */
        .ambient-light {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(227, 111, 136, 0.12) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Main Container */
        .content-container {
            position: relative;
            z-index: 2;
            max-width: 540px;
            width: 100%;
            text-align: center;
        }

        /* Romantic Aesthetic Title */
        .main-title {
            font-family: 'Great Vibes', cursive;
            font-size: 48px;
            color: #ffffff;
            margin-bottom: 25px;
            font-weight: 400;
            letter-spacing: 1px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Typewriter Text - Mas maliit ang font size para mas malinis */
        .typewriter-text {
            font-family: 'Playfair Display', serif;
            font-size: 15.5px; /* Slightly smaller font size */
            font-weight: 400;
            color: #ffffff;
            line-height: 1.8;
            min-height: 120px;
            white-space: pre-wrap;
            text-align: left;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 16px;
            background-color: #ffffff;
            animation: blink 0.7s infinite;
            vertical-align: middle;
            margin-left: 2px;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Aesthetic Minimalist White Button */
        .btn {
            display: none;
            margin-top: 35px;
            padding: 12px 28px;
            background-color: #ffffff;
            color: #4a0e18;
            border: none;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            background-color: #f8dfe5;
            color: #370a12;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <!-- Ambient Lighting Effect -->
    <div class="ambient-light"></div>

    <!-- Main Container -->
    <div class="content-container">
        <!-- Title -->
        <h1 class="main-title">Read Me First</h1>
        
        <!-- Letter Body -->
        <div class="typewriter-text"><span id="typed"></span><span class="cursor">&nbsp;</span></div>

        <!-- Redirection Button -->
        <a id="openBtn" href="gallery.html" class="btn">Open Our Memories ✨</a>
    </div>

    <script>
        const textToType = `Hi, Cristy... Mi amor. ♡

If you're reading this, then you've already found the little surprise I've been keeping just for you.

Before anything else...
Happy 3rd Anniversary, my love. 

Three years ago, we started a story that slowly became one of the most beautiful parts of my life.

Since then, every smile, every laugh, every adventure, every challenge, and every "I love you" has become a memory I'll always cherish.

People say time flies...
But with you, every moment is worth remembering.

This isn't just a collection of pictures.
It's a little piece of our journey.
A reminder of how "you and me" became us.

So, take your time.
Smile.
Enjoy.
Relive every moment. ♡`;
        
        let charIndex = 0;

        function runTypewriter() {
            const container = document.getElementById("typed");
            const btn = document.getElementById("openBtn");

            if (charIndex < textToType.length) {
                container.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(runTypewriter, 32);
            } else {
                if (btn) {
                    btn.style.display = "inline-block";
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            runTypewriter();
        });
    </script>

</body>
</html>
