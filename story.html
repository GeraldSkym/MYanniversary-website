<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story - Cristy Limbago</title>
    <!-- Google Fonts: Playfair Display & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 20px;
            font-family: 'Playfair Display', serif;
            position: relative;
            overflow-x: hidden;
            
            /* Background Photo with Transparent Maroon Overlay */
            background: 
                linear-gradient(rgba(45, 8, 15, 0.80), rgba(45, 8, 15, 0.80)), 
                url('image/photo8.jpg.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Realistic Floral Background Overlays */
        .flower-corner {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            opacity: 0.65; /* Balanced blend for dark romantic vibe */
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
        }

        .flower-top-left {
            top: -20px;
            left: -20px;
            width: 280px;
            transform-origin: top left;
            animation: swayLeft 6s ease-in-out infinite alternate;
        }

        .flower-bottom-right {
            bottom: -20px;
            right: -20px;
            width: 300px;
            transform-origin: bottom right;
            animation: swayRight 7s ease-in-out infinite alternate;
        }

        /* Subtle swaying animation para buhay na buhay ang mga bulaklak */
        @keyframes swayLeft {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(2deg) scale(1.03); }
        }

        @keyframes swayRight {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(-2deg) scale(1.03); }
        }

        /* Direct Container Without Card Background */
        .content-container {
            position: relative;
            z-index: 2;
            max-width: 580px;
            width: 100%;
            text-align: center;
        }

        /* Minimalist Heart Accent */
        .heart-icon {
            font-size: 26px;
            color: #ffffff;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Typewriter Text */
        .typewriter-text {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 400;
            color: #ffffff;
            line-height: 1.75;
            min-height: 100px;
            white-space: pre-wrap;
            text-align: left;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 18px;
            background-color: #ffffff;
            animation: blink 0.7s infinite;
            vertical-align: middle;
            margin-left: 2px;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Aesthetic Minimalist White Button */
        .btn {
            display: none;
            margin-top: 32px;
            padding: 12px 30px;
            background-color: #ffffff;
            color: #4a0e18;
            border: none;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            background-color: #f8dfe5;
            color: #370a12;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        /* Adjustment para sa mobile screen */
        @media (max-width: 600px) {
            .flower-top-left { width: 180px; }
            .flower-bottom-right { width: 200px; }
        }
    </style>
</head>
<body>

    <!-- Realistic Transparent Floral Overlays -->
    <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=600&auto=format&fit=crop" class="flower-corner flower-top-left" alt="Floral Accent Top">
    <img src="https://images.unsplash.com/photo-1508615070457-7baeba4003ab?q=80&w=600&auto=format&fit=crop" class="flower-corner flower-bottom-right" alt="Floral Accent Bottom">

    <!-- Main Container -->
    <div class="content-container">
        <div class="heart-icon">♥</div>
        
        <div class="typewriter-text"><span id="typed"></span><span class="cursor">&nbsp;</span></div>

        <!-- Link Redirection Button -->
        <a id="openBtn" href="gallery.html" class="btn">Open Our Memories ✨</a>
    </div>

    <script>
        const textToType = `Hi, Cristy... Mi amor. ♡

If you're reading this, then you've already found the little surprise I've been keeping just for you.

Before anything else...
Happy 3rd Anniversary, my love. ♥️

Three years ago, we started a story that slowly became one of the most beautiful parts of my life.

Since then, every smile, every laugh, every adventure, every challenge, and every "I love you" has become a memory I'll always cherish.

People say time flies...
But with you, every moment is worth remembering.

This isn't just a collection of pictures.
It's a little piece of our journey.
A reminder of how "you and me" became us.

So, take your time.
Smile.
Cry.
Relive every moment. ♡`;
        
        let charIndex = 0;

        function runTypewriter() {
            const container = document.getElementById("typed");
            const btn = document.getElementById("openBtn");

            if (charIndex < textToType.length) {
                container.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(runTypewriter, 32);
            } else {
                if (btn) {
                    btn.style.display = "inline-block";
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            runTypewriter();
        });
    </script>

</body>
</html>
