<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Gallery - Cristy Limbago</title>
    
    <!-- Google Fonts: Great Vibes (Romantic) + Cormorant Garamond (Elegant Minimalist) + Montserrat + Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Great+Vibes&family=Montserrat:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Warm Soft Maroon / Deep Burgundy Background */
            background: linear-gradient(135deg, #3b1119 0%, #2e0d14 100%);
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 15px;
            color: #ffffff;
        }

        /* 🌸 Romantic & Elegant Header Title */
        .header-title {
            font-family: 'Great Vibes', cursive;
            color: #f7cad0; /* Soft Rose/Pink Gold */
            font-size: 52px;
            font-weight: 400;
            margin: 10px 0 8px 0;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        /* 💌 Elegant Minimalist Message Banner */
        .message-sub {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: #f3d2d9; /* High contrast soft cream-pink */
            font-size: 20px;
            font-weight: 500;
            max-width: 620px;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 35px;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .footer-title {
            font-family: 'Montserrat', sans-serif;
            color: #ffb7c5;
            font-size: 22px;
            font-weight: 600;
            margin: 45px 0 25px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* 📸 COLLAGE GRID STYLES */
        .collage-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 22px;
            width: 100%;
            max-width: 1000px;
            padding: 10px;
        }

        .polaroid-card {
            background: #fdfbf7; /* Off-white / Cream polaroid paper */
            padding: 10px 10px 14px 10px;
            border-radius: 6px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        /* Pag-tilt ng polaroid photos */
        .polaroid-card:nth-child(odd) {
            transform: rotate(-1.5deg);
        }
        .polaroid-card:nth-child(even) {
            transform: rotate(1.5deg);
        }
        .polaroid-card:nth-child(3n) {
            transform: rotate(-1deg);
        }

        .polaroid-card:hover {
            transform: scale(1.06) rotate(0deg) !important;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .polaroid-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 3px;
            display: block;
        }

        /* 🔍 LIGHTBOX MODAL STYLES */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 4, 8, 0.92);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(247, 202, 208, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #f7cad0;
            font-size: 42px;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
        }

        .close-btn:hover {
            color: #ffffff;
        }

        /* 🔘 NAVIGATION BUTTONS */
        .btn-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .back-btn {
            padding: 12px 28px;
            background-color: transparent;
            color: #f7cad0;
            border: 2px solid #f7cad0;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            display: inline-block;
        }

        .back-btn:hover {
            background-color: rgba(247, 202, 208, 0.15);
            color: #ffffff;
            border-color: #ffffff;
            transform: translateY(-2deg);
        }

        .next-btn {
            padding: 12px 28px;
            background-color: #ff80ab;
            color: #1a060d;
            border: 2px solid #ff80ab;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(255, 128, 171, 0.3);
        }

        .next-btn:hover {
            background-color: #ff4081;
            border-color: #ff4081;
            color: #ffffff;
            transform: translateY(-2deg);
            box-shadow: 0 6px 20px rgba(255, 64, 129, 0.4);
        }
    </style>
</head>
<body>

    <h1 class="header-title">Our Memories ♥</h1>

    <!-- 💌 MESSAGE BANNER -->
    <div class="message-sub">
        "Here are some of our precious memories together over the past three wonderful years. Every moment with you is a treasure I will hold close to my heart forever."
    </div>

    <!-- 📸 PHOTO COLLAGE (Skipping photo 8) -->
    <div class="collage-container" id="galleryGrid">
        <!-- Kusang ilalagay ng JavaScript ang mga litrato maliban sa photo8 -->
    </div>

    <h1 class="footer-title">HAPPY 3RD ANNIVERSARY!</h1>

    <!-- 🔘 NAVIGATION BUTTONS -->
    <div class="btn-container">
        <a href="story.html" class="back-btn">⬅ Back to Story</a>
        <a href="flowers.html" class="next-btn">Continue →</a>
    </div>

    <!-- 🔍 LIGHTBOX MODAL -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Full view">
    </div>

    <script>
        const galleryContainer = document.getElementById('galleryGrid');
        const totalPhotos = 43;

        for (let i = 1; i <= totalPhotos; i++) {
            // 🚫 Nilalaktawan ang Memory 8 (photo8)
            if (i === 8) continue;

            const card = document.createElement('div');
            card.className = 'polaroid-card';

            const img = document.createElement('img');
            
            // Subukan muna ang .jpg.jpeg format
            const initialSrc = `image/photo${i}.jpg.jpeg`;
            img.src = initialSrc;
            img.alt = `Memory ${i}`;

            // Kapag kinlick, bubuksan ang kasalukuyang active image source sa Lightbox
            card.onclick = function() {
                openLightbox(img.src);
            };

            // Kapag nag-error, i-try ang iba pang posibleng extensions
            img.onerror = function() {
                if (this.src.endsWith('.jpg.jpeg')) {
                    this.src = `image/photo${i}.jpg`;
                } else if (this.src.endsWith('.jpg')) {
                    this.src = `image/photo${i}.jpeg`;
                } else if (this.src.endsWith('.jpeg')) {
                    this.src = `image/photo${i}.PNG`;
                }
            };

            card.appendChild(img);
            galleryContainer.appendChild(card);
        }

        function openLightbox(src) {
            document.getElementById("lightbox-img").src = src;
            document.getElementById("lightbox").style.display = "flex";
        }

        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }
    </script>

</body>
</html>
