<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Gallery - Cristy Limbago</title>
    
    <!-- Google Fonts: Montserrat para sa minimalist feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fce4ec; /* Light Pink background */
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .header-title {
            font-family: 'Montserrat', sans-serif;
            color: #4a3b3e;
            font-size: 28px;
            font-weight: 600;
            margin: 15px 0 10px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* 💌 MESSAGE BANNER */
        .message-sub {
            color: #6d5257;
            font-size: 14px;
            max-width: 600px;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .footer-title {
            font-family: 'Montserrat', sans-serif;
            color: #4a3b3e;
            font-size: 24px;
            font-weight: 600;
            margin: 40px 0 20px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* 📸 COLLAGE GRID STYLES */
        .collage-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            padding: 10px;
        }

        .polaroid-card {
            background: #fffefb;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        /* Pag-tilt ng polaroid photos */
        .polaroid-card:nth-child(odd) {
            transform: rotate(-1.5deg);
        }
        .polaroid-card:nth-child(even) {
            transform: rotate(1.5deg);
        }
        .polaroid-card:nth-child(3n) {
            transform: rotate(-1deg);
        }

        .polaroid-card:hover {
            transform: scale(1.05) rotate(0deg) !important;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        .polaroid-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 3px;
            display: block;
        }

        /* 🔍 LIGHTBOX MODAL STYLES */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.88);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            user-select: none;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .back-btn {
            padding: 12px 28px;
            background-color: transparent;
            color: #e36f88;
            border: 2px solid #e36f88;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
            letter-spacing: 1px;
            display: inline-block;
        }

        .back-btn:hover {
            background-color: #e36f88;
            color: white;
        }

        .next-btn {
            padding: 12px 28px;
            background-color: #e36f88;
            color: white;
            border: 2px solid #e36f88;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
            letter-spacing: 1px;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(227, 111, 136, 0.3);
        }

        .next-btn:hover {
            background-color: #d81b60;
            border-color: #d81b60;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(216, 27, 96, 0.4);
        }
    </style>
</head>
<body>

    <h1 class="header-title">OUR MEMORIES ♥</h1>

    <!-- 💌 MESSAGE BANNER -->
    <div class="message-sub">
        "Here are some of our precious memories together over the past three wonderful years. Every moment with you is a treasure I will hold close to my heart forever."
    </div>

    <!-- 📸 PHOTO COLLAGE (43 Photos Dynamic Grid) -->
    <div class="collage-container" id="galleryGrid">
        <!-- Kusang ilalagay ng JavaScript ang photo1 hanggang photo43 dito -->
    </div>

    <h1 class="footer-title">HAPPY 3RD ANNIVERSARY!</h1>

    <!-- 🔘 NAVIGATION BUTTONS -->
    <div class="btn-container">
        <a href="story.html" class="back-btn">⬅ Back to Story</a>
        <a href="flowers.html" class="next-btn">Flowers For You 🌸 →</a>
    </div>

    <!-- 🔍 LIGHTBOX MODAL -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Full view">
    </div>

    <script>
        const galleryContainer = document.getElementById('galleryGrid');
        const totalPhotos = 43;

        for (let i = 1; i <= totalPhotos; i++) {
            const card = document.createElement('div');
            card.className = 'polaroid-card';

            const img = document.createElement('img');
            
            // Subukan muna ang .jpg.jpeg format
            const initialSrc = `image/photo${i}.jpg.jpeg`;
            img.src = initialSrc;
            img.alt = `Memory ${i}`;

            // Kapag kinlick, bubuksan ang kasalukuyang active image source sa Lightbox
            card.onclick = function() {
                openLightbox(img.src);
            };

            // Kapag nag-error, i-try ang iba pang posibleng extensions
            img.onerror = function() {
                if (this.src.endsWith('.jpg.jpeg')) {
                    this.src = `image/photo${i}.jpg`;
                } else if (this.src.endsWith('.jpg')) {
                    this.src = `image/photo${i}.jpeg`;
                } else if (this.src.endsWith('.jpeg')) {
                    this.src = `image/photo${i}.PNG`;
                }
            };

            card.appendChild(img);
            galleryContainer.appendChild(card);
        }

        function openLightbox(src) {
            document.getElementById("lightbox-img").src = src;
            document.getElementById("lightbox").style.display = "flex";
        }

        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }
    </script>

</body>
</html>
