<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Gallery - Cristy Limbago</title>
    <!-- Cursive font para sa title -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fce4ec; /* Light Pink background */
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
            box-sizing: border-box;
        }

        .header-title {
            font-family: 'Great Vibes', cursive;
            color: #4a3b3e;
            font-size: 52px;
            margin: 10px 0 10px 0;
            text-align: center;
            font-weight: normal;
        }

        /* 💌 MESSAGE BANNER */
        .message-sub {
            color: #6d5257;
            font-size: 16px;
            max-width: 600px;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 30px;
            font-style: italic;
        }

        .footer-title {
            font-family: 'Great Vibes', cursive;
            color: #4a3b3e;
            font-size: 58px;
            margin: 40px 0 20px 0;
            text-align: center;
            font-weight: normal;
        }

        /* 📸 COLLAGE GRID STYLES */
        .collage-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 900px;
            padding: 10px;
        }

        .polaroid-card {
            background: #fffefb;
            padding: 12px;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        /* Pag-tilt ng polaroid photos */
        .polaroid-card:nth-child(odd) {
            transform: rotate(-2deg);
        }
        .polaroid-card:nth-child(even) {
            transform: rotate(2deg);
        }
        .polaroid-card:nth-child(3n) {
            transform: rotate(-1deg);
        }

        .polaroid-card:hover {
            transform: scale(1.05) rotate(0deg) !important;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        .polaroid-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 2px;
            display: block;
        }

        /* 🔍 LIGHTBOX MODAL STYLES */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        .back-btn {
            margin-top: 20px;
            padding: 10px 24px;
            background-color: transparent;
            color: #e36f88;
            border: 2px solid #e36f88;
            border-radius: 25px;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background-color: #e36f88;
            color: white;
        }
    </style>
</head>
<body>

    <h1 class="header-title">Happy 3rd</h1>

    <!-- 💌 ENGLISH MESSAGE BANNER -->
    <div class="message-sub">
        "Here are some of our precious memories together over the past three wonderful years. Every moment with you is a treasure I will hold close to my heart forever." ♥
    </div>

    <!-- 📸 PHOTO COLLAGE (12 Photos Without Captions) -->
    <div class="collage-container">
        <div class="polaroid-card" onclick="openLightbox('image/photo1.jpg')">
            <img src="image/photo1.jpg" alt="Memory 1">
        </div>
        <div class="polaroid-card" onclick="openLightbox('image/photo2.jpg')">
            <img src="image/photo2.jpg" alt="Memory 2">
        </div>
        <div class="polaroid-card" onclick="openLightbox('image/photo3.jpg')">
            <img src="image/photo3.jpg" alt="Memory 3">
        </div>
        <div class="polaroid-card" onclick="openLightbox('image/photo4.jpg')">
            <img src="image/photo4.jpg" alt="Memory 4">
        </div>
        <div class="polaroid-card" onclick="openLightbox('image/photo5.jpg')">
            <img src="image/photo5.jpg" alt="Memory 5">
        </div>
        <div class="polaroid-card" onclick="openLightbox('image/photo6.jpg')">
            <img src="image/photo6.jpg" alt="Memory 6">
        </div>
        <div class="polaroid-card" onclick="openLightbox('image/photo7.jpg')">
            <img src="image/photo7.jpg" alt="Memory 7">
        </div>
        <div class="polaroid-card" onclick="openLightbox('image/photo8.jpg')">
            <img src="image/photo8.jpg" alt="Memory 8">
        </div>
        <div class="polaroid-card" onclick="openLightbox('image/photo9.jpg')">
            <img src="image/photo9.jpg" alt="Memory 9">
        </div>
        <div class="polaroid-card" onclick="openLightbox('image/photo10.jpg')">
            <img src="image/photo10.jpg" alt="Memory 10">
        </div>
        <div class="polaroid-card" onclick="openLightbox('image/photo11.jpg')">
            <img src="image/photo11.jpg" alt="Memory 11">
        </div>
        <div class="polaroid-card" onclick="openLightbox('image/photo12.jpg')">
            <img src="image/photo12.jpg" alt="Memory 12">
        </div>
    </div>

    <h1 class="footer-title">Anniversary!</h1>

    <a href="story.html" class="back-btn">⬅ Back to Story</a>

    <!-- 🔍 LIGHTBOX MODAL -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Full view">
    </div>

    <script>
        function openLightbox(src) {
            document.getElementById("lightbox-img").src = src;
            document.getElementById("lightbox").style.display = "flex";
        }

        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }
    </script>

</body>
</html>
