<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary, Love! Cristy Limbago</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating petals -->
    <div class="petal petal-1">❀</div>
    <div class="petal petal-2">❀</div>
    <div class="petal petal-3">❀</div>
    <div class="petal petal-4">✦</div>
    <div class="petal petal-5">✦</div>

    <!-- Main white card -->
    <main class="anniversary-card">

        <div class="top-heart">♥</div>

        <h1>
            Happy 3rd
            <span>
                Anniversary,
                <strong>Love!</strong>
                <b>♥</b>
            </span>
        </h1>

        <div class="short-divider">
            <span></span>
            <i>♥</i>
            <span></span>
        </div>

        <p class="message">
            Every love story is beautiful,<br>
            but ours is my <strong>favorite.</strong> <b>♥</b>
        </p>

        <div class="long-divider">
            <span></span>
            <i>♥</i>
            <span></span>
        </div>

        <form id="anniversaryForm" onsubmit="checkAnniversaryDate(event)">
            <label for="anniversaryDate">
                <span class="calendar">▣</span>
                Enter Our Anniversary Date <b>♥</b>
            </label>

            <div class="input-wrapper">
                <input type="date" id="anniversaryDate" required>
            </div>

            <!-- Error message container -->
            <p id="errorMessage" style="color: #d9534f; font-size: 15px; margin-top: 10px; margin-bottom: 15px; display: none; font-weight: 500; font-family: 'Poppins', sans-serif;"></p>

            <button type="submit" id="unlockBtn">
                <span>🔒</span>
                Unlock Our Story <b>♥</b>
            </button>
        </form>

        <p class="forever">
            <span>✦</span>
            This is just the beginning of our forever
            <span>✦</span>
        </p>

    </main>

    <!-- Inline Logic Fix -->
    <script>
        function checkAnniversaryDate(event) {
            // Pigilan ang pag-reload ng page
            event.preventDefault();

            const CORRECT_DATE = "2026-07-30";
            const dateInput = document.getElementById("anniversaryDate");
            const errorMessage = document.getElementById("errorMessage");
            const userSelectedDate = dateInput.value;

            // 1. Kapag walang piniling date
            if (!userSelectedDate) {
                errorMessage.textContent = "❌ Please select our anniversary date first ♥";
                errorMessage.style.display = "block";
                return false;
            }

            // 2. Kapag TAMA ang date
            if (userSelectedDate === CORRECT_DATE) {
                errorMessage.style.display = "none";
                dateInput.style.borderColor = "#e7c6cd";
                
                document.body.style.transition = "opacity 1.2s ease";
                document.body.style.opacity = "0";

                setTimeout(() => {
                    alert("✨ Correct date! Unlocking Our Story...");
                    document.body.style.opacity = "1"; 
                }, 1200);

            } else {
                // 3. Kapag MALI ang date
                errorMessage.textContent = "❌ Incorrect password, try again my love! ♥";
                errorMessage.style.display = "block";
                dateInput.style.borderColor = "#d9534f";
            }

            return false;
        }
    </script>

</body>

</html>
