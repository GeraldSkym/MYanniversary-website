<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 3rd Anniversary Love ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Floral Design -->
    <div class="floral floral-top-left"></div>
    <div class="floral floral-bottom-right"></div>

    <!-- Main Card -->
    <div class="container">

        <div class="card">

            <h1 class="title">
                Happy 3rd Anniversary,
                <span>Love!</span> ❤️
            </h1>

            <p class="subtitle">
                Every love story is beautiful,<br>
                but ours is my favorite.
            </p>

            <div class="divider"></div>

            <label class="input-label">
                📅 Enter Our Anniversary Date
            </label>

            <input
                type="date"
                id="anniversaryDate"
                placeholder="MM / DD / YYYY">

            <button class="unlock-btn">
                ❤️ Unlock Our Story ❤️
            </button>

            <p class="footer-text">
                This is just the beginning of our forever ✨
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
