<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 3rd Anniversary ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Decorations -->
    <div class="flower flower-top-left">🌸</div>
    <div class="flower flower-top-right">🌸</div>
    <div class="flower flower-bottom-left">🌿</div>
    <div class="flower flower-bottom-right">🌿</div>

    <!-- Main Card -->
    <div class="card">

        <h1>Happy 3rd Anniversary, Love! ❤️</h1>

        <p class="quote">
            Every love story is beautiful,<br>
            but ours is my favorite.
        </p>

        <h3>Enter Our Anniversary Date</h3>

        <input
            type="date"
            id="anniversaryDate">

        <button onclick="checkDate()">
            Unlock Our Story ❤️
        </button>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
