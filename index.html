<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary, Love!</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating petals -->
    <div class="petal petal-1">❀</div>
    <div class="petal petal-2">❀</div>
    <div class="petal petal-3">❀</div>
    <div class="petal petal-4">✦</div>
    <div class="petal petal-5">✦</div>

    <!-- Main white card -->
    <main class="anniversary-card">

        <div class="top-heart">♥</div>

        <h1>
            Happy 3rd
            <span>
                Anniversary,
                <strong>Love!</strong>
                <b>♥</b>
            </span>
        </h1>

        <div class="short-divider">
            <span></span>
            <i>♥</i>
            <span></span>
        </div>

        <p class="message">
            Every love story is beautiful,<br>
            but ours is my <strong>favorite.</strong> <b>♥</b>
        </p>

        <div class="long-divider">
            <span></span>
            <i>♥</i>
            <span></span>
        </div>

        <form id="anniversaryForm" onsubmit="return false;">
            <label for="anniversaryDate">
                <span class="calendar">▣</span>
                Enter Our Anniversary Date <b>♥</b>
            </label>

            <div class="input-wrapper">
                <input type="date" id="anniversaryDate" required>
            </div>

            <!-- Error message container -->
            <p id="errorMessage" style="color: #d9534f; font-size: 15px; margin-bottom: 15px; display: none; font-weight: 500; font-family: 'Poppins', sans-serif;"></p>

            <button type="button" id="unlockBtn">
                <span>🔒</span>
                Unlock Our Story <b>♥</b>
            </button>
        </form>

        <p class="forever">
            <span>✦</span>
            This is just the beginning of our forever
            <span>✦</span>
        </p>

    </main>

    <!-- JavaScript -->
    <script src="script.js?v=4"></script>

</body>

</html>
