<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Anniversary ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
text-align:center;
color:white;
padding:20px;
}

h1{
font-size:50px;
margin-bottom:20px;
}

p{
font-size:22px;
margin-bottom:30px;
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:50px;
background:white;
color:#ff4f81;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

.heart{
position:absolute;
color:red;
animation:fall 6s linear infinite;
font-size:25px;
}

@keyframes fall{
0%{
transform:translateY(-100vh);
opacity:1;
}
100%{
transform:translateY(100vh);
opacity:0;
}
}
</style>

</head>

<body>

<div class="container">
<h1>Happy Anniversary ❤️</h1>
<p>Every moment with you is my favorite memory.</p>

<button onclick="showMessage()">
Open My Heart
</button>
</div>

<script>
function showMessage(){
alert("Happy Anniversary, My Love! ❤️\n\nThank you for staying with me. I love you so much.");
}

for(let i=0;i<40;i++){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(Math.random()*3+3)+"s";
heart.style.fontSize=(Math.random()*20+15)+"px";
document.body.appendChild(heart);
}
</script>

</body>
</html>
