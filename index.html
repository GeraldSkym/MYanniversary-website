<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Happy Anniversary, Love!</title>

    <!-- Elegant fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Floral line-art decorations -->

    <svg
        class="floral floral-top"
        viewBox="0 0 500 500"
        aria-hidden="true"
    >

        <!-- Big flower -->

        <g
            fill="none"
            stroke="currentColor"
            stroke-width="2"
        >

            <path d="
                M105 135
                C40 80, 30 5, 115 25
                C170 38, 175 90, 130 140
            "/>

            <path d="
                M105 135
                C25 135, 0 205, 60 235
                C115 260, 160 220, 140 165
            "/>

            <path d="
                M105 135
                C70 215, 110 290, 175 255
                C220 225, 185 160, 130 145
            "/>

            <path d="
                M105 135
                C155 65, 245 70, 230 125
                C220 175, 160 175, 125 145
            "/>

            <path d="
                M105 135
                C65 60, 110 -5, 160 25
                C200 50, 170 115, 125 145
            "/>

            <!-- Flower center -->

            <circle cx="108" cy="140" r="10"/>

            <path d="M108 140 L45 105"/>
            <path d="M108 140 L35 145"/>
            <path d="M108 140 L50 185"/>
            <path d="M108 140 L80 215"/>
            <path d="M108 140 L150 205"/>
            <path d="M108 140 L185 165"/>
            <path d="M108 140 L170 95"/>

            <!-- Leaves -->

            <path d="
                M150 55
                C205 10, 245 20, 255 35
                C220 65, 185 72, 150 55
            "/>

            <path d="
                M190 85
                C260 45, 305 55, 315 75
                C275 105, 230 110, 190 85
            "/>

            <path d="
                M210 125
                C285 110, 325 135, 330 160
                C270 170, 235 155, 210 125
            "/>

            <path d="
                M75 240
                C45 295, 65 330, 90 340
                C110 295, 105 265, 75 240
            "/>

        </g>

    </svg>


    <svg
        class="floral floral-bottom"
        viewBox="0 0 600 600"
        aria-hidden="true"
    >

        <g
            fill="none"
            stroke="currentColor"
            stroke-width="2"
        >

            <!-- Flower -->

            <path d="
                M400 410
                C320 325, 225 330, 225 395
                C225 455, 320 465, 385 430
            "/>

            <path d="
                M400 410
                C350 500, 395 565, 450 525
                C490 495, 465 435, 420 415
            "/>

            <path d="
                M400 410
                C470 335, 555 350, 550 415
                C545 475, 460 465, 415 430
            "/>

            <path d="
                M400 410
                C425 315, 490 280, 525 330
                C555 375, 490 420, 420 425
            "/>

            <path d="
                M400 410
                C325 385, 275 435, 305 485
                C335 530, 390 480, 410 430
            "/>

            <circle cx="400" cy="410" r="11"/>

            <!-- Stem -->

            <path d="
                M400 420
                C390 340, 385 270, 330 200
                C285 145, 250 105, 190 75
            "/>

            <!-- Leaves -->

            <path d="
                M340 250
                C285 220, 245 230, 225 260
                C275 280, 315 275, 340 250
            "/>

            <path d="
                M360 290
                C415 255, 455 265, 475 295
                C425 320, 390 315, 360 290
            "/>

            <path d="
                M315 215
                C290 165, 300 125, 330 105
                C350 155, 345 190, 315 215
            "/>

            <path d="
                M265 150
                C220 125, 180 130, 160 155
                C205 180, 240 175, 265 150
            "/>

        </g>

    </svg>


    <!-- Floating petals -->

    <div class="petal petal-1">❀</div>
    <div class="petal petal-2">❀</div>
    <div class="petal petal-3">❀</div>
    <div class="petal petal-4">✦</div>
    <div class="petal petal-5">✦</div>


    <!-- Main white card -->

    <main class="anniversary-card">

        <div class="top-heart">
            ♥
        </div>


        <h1>

            Happy 3rd

            <span>

                Anniversary,

                <strong>
                    Love!
                </strong>

                <b>♥</b>

            </span>

        </h1>


        <div class="short-divider">

            <span></span>

            <i>♥</i>

            <span></span>

        </div>


        <p class="message">

            Every love story is beautiful,

            <br>

            but ours is my

            <strong>
                favorite.
            </strong>

            <b>♥</b>

        </p>


        <div class="long-divider">

            <span></span>

            <i>♥</i>

            <span></span>

        </div>


        <form id="anniversaryForm">

            <label for="anniversaryDate">

                <span class="calendar">
                    ▣
                </span>

                Enter Our Anniversary Date

                <b>♥</b>

            </label>


            <div class="input-wrapper">

                <input
                    type="date"
                    id="anniversaryDate"
                    required
                >

            </div>


            <button type="submit">

                <span>
                    🔒
                </span>

                Unlock Our Story

                <b>♥</b>

            </button>

        </form>


        <p class="forever">

            <span>✦</span>

            This is just the beginning of our forever

            <span>✦</span>

        </p>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
