<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Anniversary, Love!</title>

    <!-- Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <!-- Floral background -->
    <div class="flower top-flower">✿</div>
    <div class="flower bottom-flower">✿</div>

    <div class="leaf leaf-1">❀</div>
    <div class="leaf leaf-2">♡</div>
    <div class="leaf leaf-3">✦</div>
    <div class="leaf leaf-4">❀</div>

    <!-- Main card -->
    <main class="anniversary-card">

        <div class="main-heart">♥</div>

        <h1>
            Happy 3rd

            <span>
                Anniversary,
                <b>Love!</b>
                ♥
            </span>
        </h1>

        <div class="divider">

            <span></span>

            <i>♥</i>

            <span></span>

        </div>

        <p class="love-message">

            Every love story is beautiful,

            <br>

            but ours is my

            <strong>favorite.</strong>

            ♥
        </p>

        <div class="long-divider">

            <span></span>

            <i>♥</i>

            <span></span>

        </div>

        <form id="anniversaryForm">

            <label for="anniversaryDate">

                📅 &nbsp; Enter Our Anniversary Date

                <small>♥</small>

            </label>

            <div class="date-container">

                <input
                    type="date"
                    id="anniversaryDate"
                    required
                >

            </div>

            <button type="submit">

                🔒

                <span>
                    Unlock Our Story
                </span>

                ♥
            </button>

        </form>

        <p class="forever">

            ✦ &nbsp;
            This is just the beginning of our forever
            &nbsp; ✦

        </p>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
