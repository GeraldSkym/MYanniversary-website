<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 3rd anniversary my lovee!! cristy limbago</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Montserrat para sa minimalist title, Poppins para sa iba -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fce4ec;
            /* 🌸 OPTION 1: Soft Aesthetic Floral Pattern Wallpaper */
            background-image: 
                radial-gradient(#f8bbd0 1.5px, transparent 1.5px), 
                radial-gradient(#f48fb1 1.5px, #fce4ec 1.5px);
            background-size: 36px 36px;
            background-position: 0 0, 18px 18px;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .anniversary-card {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
            position: relative;
        }

        .top-heart {
            color: #e36f88;
            font-size: 24px;
            margin-bottom: 12px;
        }

        /* ✨ MINIMALIST & ALL CAPS HEADER */
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            color: #4a3b3e;
            font-weight: 600;
            line-height: 1.4;
            text-transform: uppercase; /* ALL CAPS */
            letter-spacing: 2px; /* Spacing para sa minimalist luxury feel */
            margin-bottom: 8px;
        }

        .message {
            font-size: 13px;
            color: #7d6267;
            margin: 15px 0 25px 0;
            line-height: 1.5;
            letter-spacing: 0.5px;
        }

        /* 🔒 PASSCODE DISPLAY (DOTS) */
        .passcode-display {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #e36f88;
            background-color: transparent;
            transition: all 0.2s ease;
        }

        .dot.active {
            background-color: #e36f88;
        }

        .error-message {
            color: #d9534f;
            font-size: 13px;
            margin-bottom: 15px;
            min-height: 20px;
            font-weight: 500;
        }

        /* 🔢 KEYPAD GRID */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 280px;
            margin: 0 auto;
        }

        .key-btn {
            background: #fff0f3;
            border: 1px solid #f8bbd0;
            color: #4a3b3e;
            font-size: 20px;
            font-weight: 500;
            padding: 14px 0;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            margin: 0 auto;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .key-btn:active {
            background: #e36f88;
            color: white;
            transform: scale(0.95);
        }

        .clear-btn {
            font-size: 13px;
            background: transparent;
            border: none;
            color: #888;
        }

        .forever {
            font-size: 11px;
            color: #a08a8e;
            margin-top: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <main class="anniversary-card">
        <div class="top-heart">♥</div>

        <!-- 📌 MINIMALIST ALL CAPS HEADER -->
        <h1>Happy 3rd anniversary my lovee!! cristy limbago</h1>

        <p class="message">Enter our anniversary date to unlock our story</p>

        <!-- Passcode Dots (6 Digits para sa 073026) -->
        <div class="passcode-display">
            <div class="dot" id="dot-0"></div>
            <div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div>
            <div class="dot" id="dot-4"></div>
            <div class="dot" id="dot-5"></div>
        </div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage"></div>

        <!-- 0-9 Keypad -->
        <div class="keypad">
            <button class="key-btn" onclick="pressKey('1')">1</button>
            <button class="key-btn" onclick="pressKey('2')">2</button>
            <button class="key-btn" onclick="pressKey('3')">3</button>
            <button class="key-btn" onclick="pressKey('4')">4</button>
            <button class="key-btn" onclick="pressKey('5')">5</button>
            <button class="key-btn" onclick="pressKey('6')">6</button>
            <button class="key-btn" onclick="pressKey('7')">7</button>
            <button class="key-btn" onclick="pressKey('8')">8</button>
            <button class="key-btn" onclick="pressKey('9')">9</button>
            <button class="key-btn clear-btn" onclick="clearPasscode()">Clear</button>
            <button class="key-btn" onclick="pressKey('0')">0</button>
            <button class="key-btn clear-btn" onclick="deleteLastDigit()">⌫</button>
        </div>

        <p class="forever">✦ This is just the beginning of our forever ✦</p>
    </main>

    <script>
        const CORRECT_PASSCODE = "073026";
        let enteredPasscode = "";

        function pressKey(num) {
            if (enteredPasscode.length < 6) {
                enteredPasscode += num;
                updateDots();
                document.getElementById("errorMessage").textContent = "";

                if (enteredPasscode.length === 6) {
                    setTimeout(checkPasscode, 200);
                }
            }
        }

        function updateDots() {
            for (let i = 0; i < 6; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < enteredPasscode.length) {
                    dot.classList.add("active");
                } else {
                    dot.classList.remove("active");
                }
            }
        }

        function checkPasscode() {
            const errorMsg = document.getElementById("errorMessage");

            if (enteredPasscode === CORRECT_PASSCODE) {
                errorMsg.style.color = "#4caf50";
                errorMsg.textContent = "✔ Correct! Unlocking... ♥";

                document.body.style.transition = "opacity 1s ease";
                document.body.style.opacity = "0";

                setTimeout(() => {
                    window.location.href = "story.html";
                }, 1000);
            } else {
                errorMsg.style.color = "#d9534f";
                errorMsg.textContent = "❌ Incorrect passcode, try again my love! ♥";
                
                setTimeout(() => {
                    clearPasscode();
                }, 800);
            }
        }

        function clearPasscode() {
            enteredPasscode = "";
            updateDots();
        }

        function deleteLastDigit() {
            if (enteredPasscode.length > 0) {
                enteredPasscode = enteredPasscode.slice(0, -1);
                updateDots();
            }
        }
    </script>

</body>

</html>
