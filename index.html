<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter III: Untold</title>

    <!-- Google Fonts (Cinzel + Cormorant Garamond + Poppins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 🌸 Pinker background style */
            background-color: #fff0f3; /* Light pink background */
            background-image: 
                linear-gradient(rgba(252, 221, 227, 0.8), rgba(252, 221, 227, 0.8)), /* Pinker overlay */
                url('image/2flower-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .anniversary-card {
            background: rgba(255, 255, 255, 0.98); /* Less transparent for readability */
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(224, 150, 168, 0.3); /* Stronger shadow */
            border: 2px solid #f9d8e0; /* Thicker border */
            width: 100%;
            max-width: 380px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(8px);
        }

        .top-heart {
            color: #d87085;
            font-size: 20px;
            margin-bottom: 12px;
            letter-spacing: 3px;
        }

        /* 🏛️ Title Color Change to Deep Mauve/Pink */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: #8c505e; /* Deep mauve/pink for visibility */
            font-weight: 700;
            line-height: 1.3;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        /* 📜 Sub-Message Color Change to Deep Mauve/Pink */
        .message {
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            font-style: italic;
            color: #8c505e; /* Deep mauve/pink for visibility */
            margin: 12px 0 25px 0;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        .passcode-display {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #d87085;
            background-color: transparent;
            transition: all 0.2s ease;
        }

        .dot.active {
            background-color: #d87085;
        }

        .error-message {
            color: #e56b6f;
            font-size: 13px;
            margin-bottom: 15px;
            min-height: 20px;
            font-weight: 600; /* Bolder error */
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 280px;
            margin: 0 auto;
        }

        .key-btn {
            background: #fff8f9;
            border: 2px solid #f4cdd6; /* Thicker border */
            color: #8c505e; /* Deep mauve/pink */
            font-size: 20px;
            font-weight: 600; /* Bolder keys */
            padding: 14px 0;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            margin: 0 auto;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .key-btn:active {
            background: #d87085;
            color: white;
            border-color: #d87085;
            transform: scale(0.95);
        }

        .clear-btn {
            font-size: 14px; /* Larger clear */
            background: transparent;
            border: none;
            color: #b5838f;
            font-weight: 600;
        }

        .forever {
            font-family: 'Cinzel', serif;
            font-size: 10px;
            color: #b5838f;
            margin-top: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <main class="anniversary-card">
        <div class="top-heart">✦ ♥ ✦</div>

        <h1>Chapter III: Untold</h1>

        <p class="message">Enter our anniversary date to unlock our story</p>

        <!-- Passcode Dots (6 Digits para sa 073026) -->
        <div class="passcode-display">
            <div class="dot" id="dot-0"></div>
            <div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div>
            <div class="dot" id="dot-4"></div>
            <div class="dot" id="dot-5"></div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <!-- 0-9 Keypad -->
        <div class="keypad">
            <button class="key-btn" onclick="pressKey('1')">1</button>
            <button class="key-btn" onclick="pressKey('2')">2</button>
            <button class="key-btn" onclick="pressKey('3')">3</button>
            <button class="key-btn" onclick="pressKey('4')">4</button>
            <button class="key-btn" onclick="pressKey('5')">5</button>
            <button class="key-btn" onclick="pressKey('6')">6</button>
            <button class="key-btn" onclick="pressKey('7')">7</button>
            <button class="key-btn" onclick="pressKey('8')">8</button>
            <button class="key-btn" onclick="pressKey('9')">9</button>
            <button class="key-btn clear-btn" onclick="clearPasscode()">Clear</button>
            <button class="key-btn" onclick="pressKey('0')">0</button>
            <button class="key-btn clear-btn" onclick="deleteLastDigit()">⌫</button>
        </div>

        <p class="forever">✦ This is just the beginning ✦</p>
    </main>

    <script>
        const CORRECT_PASSCODE = "073026";
        let enteredPasscode = "";

        function pressKey(num) {
            if (enteredPasscode.length < 6) {
                enteredPasscode += num;
                updateDots();
                document.getElementById("errorMessage").textContent = "";

                if (enteredPasscode.length === 6) {
                    setTimeout(checkPasscode, 200);
                }
            }
        }

        function updateDots() {
            for (let i = 0; i < 6; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < enteredPasscode.length) {
                    dot.classList.add("active");
                } else {
                    dot.classList.remove("active");
                }
            }
        }

        function checkPasscode() {
            const errorMsg = document.getElementById("errorMessage");

            if (enteredPasscode === CORRECT_PASSCODE) {
                errorMsg.style.color = "#52b788";
                errorMsg.textContent = "✔ Correct! Unlocking... ♥";

                document.body.style.transition = "opacity 1s ease";
                document.body.style.opacity = "0";

                setTimeout(() => {
                    window.location.href = "story.html";
                }, 1000);
            } else {
                errorMsg.style.color = "#e56b6f";
                errorMsg.textContent = "❌ Incorrect passcode, try again my love! ♥";

                setTimeout(() => {
                    clearPasscode();
                }, 800);
            }
        }

        function clearPasscode() {
            enteredPasscode = "";
            updateDots();
        }

        function deleteLastDigit() {
            if (enteredPasscode.length > 0) {
                enteredPasscode = enteredPasscode.slice(0, -1);
                updateDots();
            }
        }
    </script>

</body>

</html>
