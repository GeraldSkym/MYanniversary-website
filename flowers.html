<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers For You - Cristy Limbago</title>

    <!-- Google Fonts: Great Vibes (Cursive) & Montserrat/Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 🖼️ BACKGROUND PHOTO WITH DARK MAROON OVERLAY */
            background: linear-gradient(rgba(74, 25, 35, 0.82), rgba(60, 20, 28, 0.88)), 
                        url('image/photo43.jpg.jpeg') center/cover no-repeat fixed;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            color: #ffffff;
            text-align: center;
        }

        /* ✍️ CURSIVE HEADER TITLE */
        .title {
            font-family: 'Great Vibes', cursive;
            color: #ffffff;
            font-size: 65px;
            font-weight: 400;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 5px;
            z-index: 2;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #f3d0d7;
            font-size: 14px;
            max-width: 450px;
            margin-bottom: 25px;
            letter-spacing: 1px;
            z-index: 2;
            font-weight: 300;
        }

        /* 💐 REALISTIC BOUQUET STYLES */
        .bouquet-wrapper {
            position: relative;
            z-index: 5;
            cursor: pointer;
            margin: 15px 0;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            animation: floatSway 4s ease-in-out infinite alternate;
        }

        .bouquet-img {
            width: 240px;
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .bouquet-wrapper:hover .bouquet-img {
            transform: scale(1.08);
            filter: drop-shadow(0 15px 30px rgba(255, 182, 193, 0.5));
        }

        /* Zoom animation kapag kinlick */
        .bouquet-wrapper.zoom-open {
            transform: scale(1.3) translateY(-15px) !important;
            animation: none !important;
        }

        .bouquet-wrapper.fade-out {
            opacity: 0;
            transform: scale(0.2) !important;
            pointer-events: none;
        }

        .click-hint {
            color: #fce4ec;
            font-size: 14px;
            font-weight: 400;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1.5px;
            margin-top: 10px;
            animation: pulse 1.8s infinite alternate;
            z-index: 2;
            text-transform: lowercase;
        }

        /* 🎁 GIFT BOX STYLES */
        .gift-wrapper {
            display: none;
            z-index: 6;
            cursor: pointer;
            margin: 20px 0;
            text-align: center;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gift-wrapper.show {
            display: block;
            opacity: 1;
            transform: scale(1);
            animation: bounce 2s infinite;
        }

        .gift-icon {
            font-size: 90px;
            display: block;
            user-select: none;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4));
        }

        /* 📸 REVEALED PHOTO CONTAINER */
        .photo-card {
            display: none;
            background: #fffefb;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-width: 310px;
            text-align: center;
            z-index: 10;
            opacity: 0;
            transform: translateY(30px) scale(0.9);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #333;
        }

        .photo-card.show {
            display: block;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .photo-card img {
            width: 100%;
            height: 270px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .photo-caption {
            color: #880e4f;
            font-size: 15px;
            font-weight: 600;
            margin-top: 15px;
            line-height: 1.4;
        }

        /* 🔘 CONTINUE BUTTON */
        .next-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 32px;
            background-color: #d81b60;
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .next-btn.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .next-btn:hover {
            background-color: #c2185b;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }

        /* ANIMATIONS */
        @keyframes floatSway {
            0% { transform: translateY(0) rotate(-1.5deg); }
            100% { transform: translateY(-10px) rotate(1.5deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-12px); }
            60% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

    <!-- 🎵 BACKGROUND MUSIC -->
    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-view-1033.mp3" type="audio/mp3">
    </audio>

    <!-- 📌 HEADER -->
    <h1 class="title">Flowers for you</h1>
    <p class="subtitle" id="subText">A simple gift for my favorite person in the world ❤️</p>

    <!-- 💐 REALISTIC BOUQUET IMAGE -->
    <div class="bouquet-wrapper" id="bouquetWrapper" onclick="clickBouquet()">
        <img src="https://images.unsplash.com/photo-1563241527-3004b7be0ffd?q=80&w=600&auto=format&fit=crop" 
             alt="Flowers for you" class="bouquet-img">
        <div class="click-hint" id="bouquetHint">( click the bouquet 🌸 )</div>
    </div>

    <!-- 🎁 GIFT BOX -->
    <div class="gift-wrapper" id="giftWrapper" onclick="clickGift()">
        <span class="gift-icon">🎁</span>
        <div class="click-hint" style="margin-top: 10px;">( click the gift box to open ✨ )</div>
    </div>

    <!-- 📸 REVEALED PHOTO 43 -->
    <div class="photo-card" id="photoCard">
        <img id="firstPhoto" src="image/photo43.jpg.jpeg" alt="Our Special Photo">
        <div class="photo-caption">"This is where our beautiful story began." ❤️</div>
    </div>

    <!-- 🔘 CONTINUE BUTTON -->
    <a href="story.html" class="next-btn" id="nextBtn">Continue Our Journey →</a>

    <script>
        // 1. Play Music sa unang click
        let musicStarted = false;
        function playMusic() {
            if (!musicStarted) {
                document.getElementById('bgMusic').play().catch(() => {});
                musicStarted = true;
            }
        }
        window.addEventListener('click', playMusic);

        // Background Image Fallback
        const body = document.body;
        const testImg = new Image();
        testImg.src = 'image/photo43.jpg.jpeg';
        testImg.onerror = function() {
            body.style.backgroundImage = "linear-gradient(rgba(74, 25, 35, 0.82), rgba(60, 20, 28, 0.88)), url('image/photo43.jpg')";
        };

        // Revealed Photo Extension Fallback
        const photoImg = document.getElementById('firstPhoto');
        photoImg.onerror = function() {
            if (this.src.endsWith('.jpg.jpeg')) {
                this.src = 'image/photo43.jpg';
            } else if (this.src.endsWith('.jpg')) {
                this.src = 'image/photo43.jpeg';
            } else if (this.src.endsWith('.jpeg')) {
                this.src = 'image/photo43.PNG';
            }
        };

        // 2. STEP 1: Click Bouquet
        let bouquetClicked = false;
        function clickBouquet() {
            if (bouquetClicked) return;
            bouquetClicked = true;

            const bouquet = document.getElementById('bouquetWrapper');
            document.getElementById('bouquetHint').style.display = 'none';

            bouquet.classList.add('zoom-open');

            setTimeout(() => {
                bouquet.classList.add('fade-out');
                setTimeout(() => {
                    bouquet.style.display = 'none';
                    const gift = document.getElementById('giftWrapper');
                    gift.classList.add('show');
                }, 600);
            }, 1000);
        }

        // 3. STEP 2: Click Gift Box
        let giftClicked = false;
        function clickGift() {
            if (giftClicked) return;
            giftClicked = true;

            const gift = document.getElementById('giftWrapper');
            gift.style.opacity = '0';
            gift.style.transform = 'scale(0.2)';
            
            setTimeout(() => {
                gift.style.display = 'none';

                const photoCard = document.getElementById('photoCard');
                photoCard.classList.add('show');

                setTimeout(() => {
                    document.getElementById('nextBtn').classList.add('show');
                }, 800);
            }, 500);
        }
    </script>

</body>
</html>
