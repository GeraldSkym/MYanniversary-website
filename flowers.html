<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers For You - Cristy Limbago</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Soft pink gradient background */
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 🌸 PETALS AT SPARKLES ANIMATION CONTAINER */
        .effect-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .petal, .sparkle {
            position: absolute;
            top: -10%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* HEADER TEXTS */
        .title {
            font-family: 'Montserrat', sans-serif;
            color: #4a3b3e;
            font-size: 30px;
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            z-index: 2;
        }

        .subtitle {
            color: #6d5257;
            font-size: 15px;
            text-align: center;
            max-width: 500px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        /* 💐 BOUQUET MAIN STYLES */
        .bouquet-wrapper {
            position: relative;
            z-index: 5;
            cursor: pointer;
            margin: 10px 0;
            animation: sway 4s ease-in-out infinite alternate;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .bouquet-wrapper:hover {
            filter: drop-shadow(0 0 25px rgba(255, 105, 180, 0.8));
            transform: scale(1.08);
        }

        /* Zoom in + Opening animation kapag kinlick */
        .bouquet-wrapper.zoom-open {
            transform: scale(1.4) translateY(-10px) !important;
            animation: none !important;
            filter: drop-shadow(0 0 35px rgba(255, 105, 180, 0.9));
        }

        .bouquet-wrapper.fade-out {
            opacity: 0;
            transform: scale(0.2) !important;
            pointer-events: none;
        }

        .bouquet-icon {
            font-size: 120px;
            display: block;
            text-align: center;
            user-select: none;
        }

        .click-hint {
            text-align: center;
            color: #d81b60;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite alternate;
            z-index: 2;
        }

        /* 🎁 GIFT BOX STYLES */
        .gift-wrapper {
            display: none;
            z-index: 6;
            cursor: pointer;
            margin: 20px 0;
            text-align: center;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gift-wrapper.show {
            display: block;
            opacity: 1;
            transform: scale(1);
            animation: bounce 2s infinite;
        }

        .gift-icon {
            font-size: 90px;
            display: block;
            user-select: none;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.15));
        }

        /* 📸 REVEALED FIRST PHOTO CONTAINER */
        .photo-card {
            display: none;
            background: #fffefb;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            max-width: 320px;
            text-align: center;
            z-index: 10;
            opacity: 0;
            transform: translateY(30px) scale(0.9);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .photo-card.show {
            display: block;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .photo-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .photo-caption {
            color: #d81b60;
            font-size: 15px;
            font-weight: 600;
            margin-top: 15px;
            line-height: 1.4;
        }

        /* 🔘 CONTINUE BUTTON */
        .next-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 30px;
            background-color: #e36f88;
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(227, 111, 136, 0.4);
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
            pointer-events: none;
            z-index: 10;
        }

        .next-btn.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .next-btn:hover {
            background-color: #d81b60;
            transform: translateY(-3deg) scale(1.03);
            box-shadow: 0 12px 25px rgba(216, 27, 96, 0.5);
        }

        /* KEYFRAME ANIMATIONS */
        @keyframes sway {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }
    </style>
</head>
<body>

    <!-- 🎵 BACKGROUND MUSIC -->
    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-view-1033.mp3" type="audio/mp3">
    </audio>

    <!-- 🌸 FALLING PETALS & SPARKLES -->
    <div class="effect-container" id="effects"></div>

    <!-- 📌 HEADER -->
    <h1 class="title">Flowers For You 🌸</h1>
    <p class="subtitle" id="subText">"These flowers are a small reminder of how much you mean to me." 💗</p>

    <!-- 💐 INTERACTIVE BOUQUET -->
    <div class="bouquet-wrapper" id="bouquetWrapper" onclick="clickBouquet()">
        <span class="bouquet-icon">💐</span>
    </div>
    <div class="click-hint" id="bouquetHint">(Click the bouquet to open 💌)</div>

    <!-- 🎁 GIFT BOX -->
    <div class="gift-wrapper" id="giftWrapper" onclick="clickGift()">
        <span class="gift-icon">🎁</span>
        <div class="click-hint" style="margin-top: 10px;">(Click the gift box to open ✨)</div>
    </div>

    <!-- 📸 REVEALED PHOTO 43 -->
    <div class="photo-card" id="photoCard">
        <img id="firstPhoto" src="image/photo43.jpg.jpeg" alt="Our Special Photo">
        <div class="photo-caption">"This is where our beautiful story began." ❤️</div>
    </div>

    <!-- 🔘 CONTINUE BUTTON -->
    <a href="story.html" class="next-btn" id="nextBtn">Continue Our Journey →</a>

    <script>
        // 1. Play Music sa unang click
        let musicStarted = false;
        function playMusic() {
            if (!musicStarted) {
                document.getElementById('bgMusic').play().catch(() => {});
                musicStarted = true;
            }
        }
        window.addEventListener('click', playMusic);

        // 2. Generate Floating Petals & Sparkles
        const effectsContainer = document.getElementById('effects');
        const items = ['🌸', '✨', '💖', '🌺', '🍃'];

        function createPetals(count) {
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'petal';
                el.innerText = items[Math.floor(Math.random() * items.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 3 + 3) + 's';
                el.style.animationDelay = (Math.random() * 2) + 's';
                el.style.fontSize = (Math.random() * 12 + 16) + 'px';
                effectsContainer.appendChild(el);
            }
        }
        createPetals(20);

        // Fallback check para sa Image Extension ng Photo 43
        const photoImg = document.getElementById('firstPhoto');
        photoImg.onerror = function() {
            if (this.src.endsWith('.jpg.jpeg')) {
                this.src = 'image/photo43.jpg';
            } else if (this.src.endsWith('.jpg')) {
                this.src = 'image/photo43.jpeg';
            } else if (this.src.endsWith('.jpeg')) {
                this.src = 'image/photo43.PNG';
            }
        };

        // 3. STEP 1: Click Bouquet
        let bouquetClicked = false;
        function clickBouquet() {
            if (bouquetClicked) return;
            bouquetClicked = true;

            const bouquet = document.getElementById('bouquetWrapper');
            const hint = document.getElementById('bouquetHint');

            hint.style.display = 'none';

            // Animation 1: Zoom in at lalakas ang laglag ng petals
            bouquet.classList.add('zoom-open');
            createPetals(30); // Extra burst of petals!

            // Animation 2: Pagkatapos mag-zoom, magfa-fade out ang bouquet at lalabas ang Gift Box
            setTimeout(() => {
                bouquet.classList.add('fade-out');
                setTimeout(() => {
                    bouquet.style.display = 'none';
                    const gift = document.getElementById('giftWrapper');
                    gift.classList.add('show');
                }, 600);
            }, 1200);
        }

        // 4. STEP 2: Click Gift Box
        let giftClicked = false;
        function clickGift() {
            if (giftClicked) return;
            giftClicked = true;

            const gift = document.getElementById('giftWrapper');
            gift.style.opacity = '0';
            gift.style.transform = 'scale(0.2)';
            
            setTimeout(() => {
                gift.style.display = 'none';

                // Reveal Photo Card
                const photoCard = document.getElementById('photoCard');
                photoCard.classList.add('show');

                // Burst ng Sparkles
                createPetals(25);

                // Reveal Next Button
                setTimeout(() => {
                    document.getElementById('nextBtn').classList.add('show');
                }, 1000);
            }, 500);
        }
    </script>

</body>
</html>
